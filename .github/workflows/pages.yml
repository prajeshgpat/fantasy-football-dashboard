# Rebuilds the dashboard from fresh nflverse data and deploys it to GitHub Pages.
# Runs on demand ("Run workflow", which the site's Refresh data button links to)
# and when code changes land on main. There is no schedule.
name: Build and deploy dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "templates/**", "config.py", "requirements.txt", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Prior seasons never change, so keep them between runs; src.fetch drops and
      # re-downloads the current season's files itself.
      - name: Restore cached nflverse data
        uses: actions/cache@v4
        with:
          path: data
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Fetch nflverse data
        run: python -m src.fetch

      - name: Build dashboard
        run: |
          mkdir -p site
          python -m src.build_dashboard site/index.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
